<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidature reçue · M&C Summit Dubaï</title>
<meta name="robots" content="noindex, nofollow">

<style>
@font-face{font-family:'Noe Display';src:url('/fonts/NoeDisplay-Regular.woff2') format('woff2'),url('/fonts/NoeDisplay-Regular.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url('/assets/fonts/inter-latin.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
</style>
</head>
<body>
<section class="merci">
  <div class="wrap">
    <div class="eyebrow" style="color:rgba(255,255,255,.55)">M&amp;C Summit Dubaï</div>
    <h1>Candidature reçue.</h1>
    <p>Merci. On étudie ton profil et, s'il correspond, on te recontacte très vite sur WhatsApp pour organiser l'appel de sélection. Garde un œil sur ton téléphone.</p>
    <a class="btn" href="/dubai/">Retour à la page du Summit</a>
  </div>
</section>
<script>
/* Evenement Lead : cette page n'est atteinte qu'apres completion du formulaire.
   Pixel charge uniquement si le consentement a ete donne sur la landing. */
var META_PIXEL_ID = '1591286586126927';
(function(){
  var state = null;
  try { state = localStorage.getItem('mc-summit-consent'); } catch(e) {}
  if(state !== 'granted') return;
  /* Dedup : si le Lead a deja ete envoye par le callback onSubmit du
     formulaire embarque (meme onglet), ne pas le renvoyer ici. On ne
     l'envoie donc que pour le parcours via le lien direct du Typeform. */
  var alreadyFired = false;
  try { alreadyFired = sessionStorage.getItem('mc-lead-fired') === '1'; } catch(e) {}
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', META_PIXEL_ID);
  fbq('track', 'PageView');
  if(!alreadyFired){ fbq('track', 'Lead'); }
})();
</script>
</body>
</html>
