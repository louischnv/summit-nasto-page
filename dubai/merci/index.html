<body>
<section class="merci">
  <div class="wrap">
    <div class="eyebrow" style="color:rgba(255,255,255,.55)">M&amp;C Summit Dubaï</div>
    <h1>Candidature reçue.</h1>
    <p>Merci. On étudie ton profil et, s'il correspond, on te recontacte très vite sur WhatsApp pour organiser l'appel de sélection. Garde un œil sur ton téléphone.</p>
    <a class="btn" href="/dubai/">Retour à la page du Summit</a>
  </div>
</section>
<script>
/* Page de confirmation. L'evenement de conversion (Lead + CandidatureQualifiee
   pour les >=3000, avec la valeur budget) est envoye en server-side via l'API
   Conversions Meta (webhook Typeform -> fonction Netlify), a partir des vraies
   reponses. On ne declenche donc PAS le Lead ici : cela evite le double
   comptage et garantit que la conversion n'est pas ratee par un adblock.
   On garde seulement le PageView (retargeting), si le consentement est donne. */
var META_PIXEL_ID = '1591286586126927';
(function(){
  var state = null;
  try { state = localStorage.getItem('mc-summit-consent'); } catch(e) {}
  if(state !== 'granted') return;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', META_PIXEL_ID);
  fbq('track', 'PageView');
})();
</script>
